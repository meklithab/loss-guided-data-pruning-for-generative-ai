# Default hyperparameters for the scoped-down 4-week plan.
# Override any of these from the CLI, e.g. --model_name ... or --lora_r 16

seed: 42

model_name: "Qwen/Qwen2.5-0.5B-Instruct"
dataset_name: "tatsu-lab/alpaca"
use_4bit: false

# Data splits (fractions of the full dataset)
val_frac: 0.05
test_frac: 0.05

# Tokenization
max_length: 256

# LoRA
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Phase 1: warm-up tracking run
# Fractions of ONE warm-up epoch at which we snapshot per-example loss.
warmup_checkpoint_fracs: [0.10, 0.25, 0.50, 1.00]
warmup_batch_size: 8
warmup_lr: 2.0e-4

# Phase 4: final training on selected subset
train_epochs: 3
train_batch_size: 8
train_lr: 2.0e-4
grad_accum_steps: 1

# Budgets to sweep (fraction of full dataset kept)
budgets: [0.10, 0.30, 0.50, 1.00]

# Selection strategies to compare
strategies:
  - random
  - low_loss
  - high_loss
  - loss_delta
  - dynamics
  - dynamics_diversity

# Experiment 5 (leave-k-out ground truth)
leave_k_out:
  n_examples_sampled: 200   # examples drawn from the SELECTED (e.g. 30%) subset
  group_size: 10            # examples retrained-without per group -> 20 groups
  eval_subset_size: 300     # held-out examples used to measure loss delta per group
